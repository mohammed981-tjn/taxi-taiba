plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'    // الأفضل من kotlin-android
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.oago.com.ng.flutter_projects'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // ── هوية الحزمة لكل نكهة ────────────────────────────────────────────
    //
    // كانت النكهات الثلاث تحمل `applicationId` واحداً، وهو ما يراه أندرويد
    // **تعريفاً للتطبيق**: نفس المعرّف = نفس التطبيق. فتثبيت لوحة الإدارة كان
    // يُعرَض كتحديث لتطبيق الراكب، ثم يفشل بـ«تتعارض مع حزمة حالية» لأن
    // توقيعهما أو محتواهما لا يتطابق. ولا يمكن أن تجتمع الثلاثة على جهاز.
    //
    // الفصل في Dart كان صحيحاً وناقصاً: يمنع الشيفرة من الانتشار، ولا يجعل
    // منها تطبيقات. الهوية هنا هي ما يجعلها كذلك.
    //
    // والنكهة تصل من سطر البناء — `-Pflavor=driver` — كي تبقى نقطة الدخول
    // (`-t lib/main_driver.dart`) وهوية الحزمة معرَّفتين في مكان واحد: مصفوفة
    // CI.
    def flavorName = (project.findProperty('flavor') ?: 'passenger').toString()

    // لماذا للراكب لاحقةٌ أيضاً؟
    //
    // `com.rididago.com` ليس اسماً اخترناه — هو اسم القالب الذي بُني عليه هذا
    // المشروع، وبُني عليه غيره. وأندرويد يقرأ هذا الاسم **تعريفاً للتطبيق**:
    // حزمتان بالاسم نفسه هما تطبيق واحد عنده، فيُعرض تثبيت الثانية «تحديثاً»
    // للأولى، ثم يُرفض لأن توقيعهما مختلف — «الحزمة تبدو غير صالحة».
    //
    // وهو ما حدث فعلاً: نزلت نسخة السائق والإدارة (لاحقتاهما تميّزانهما)
    // ورُفضت نسخة الراكب وحدها، لأنها الوحيدة التي بقيت على اسم القالب.
    //
    // فلكلّ نكهة لاحقتها، ولا يبقى أحدها على الاسم المشترك. ولا يسري هذا حتى
    // تُسجَّل `com.rididago.com.passenger` في كونسول Firebase ويُستبدل
    // google-services.json — إلى حينها يعود البناء إلى الاسم القديم مع تحذير،
    // كما هو مشروح تحت.
    def flavorSuffix = [passenger: '.passenger', driver: '.driver', admin: '.admin']
    def flavorLabel  = [passenger: 'Taibah', driver: 'Taibah سائق', admin: 'Taibah إدارة']

    // لون خلفية الأيقونة المتكيّفة — نفس لون النكهة في lib/theme/app_theme.dart.
    // تكرارٌ لا مفرّ منه: Gradle لا يقرأ Dart، وموارد أندرويد تُحسم عند البناء
    // لا عند التشغيل. وهما مذكوران هنا وهناك بالتعليق نفسه كي لا ينفرد أحدهما.
    def flavorIconColor = [
        passenger: '#0D1B4C',
        driver:    '#0E7C5A',
        admin:     '#5B3E96'
    ]

    def baseApplicationId = 'com.rididago.com'
    def wantedApplicationId = baseApplicationId + (flavorSuffix[flavorName] ?: '')

    // Firebase لا يعرف حزمةً لم تُسجَّل: إضافةُ `applicationId` غير موجود في
    // google-services.json تُفشل البناء بـ«No matching client found». فبدل أن
    // ينكسر البناء حتى تُسجَّل الحزمتان الجديدتان في الكونسول، يُقرأ الملفّ
    // هنا ويُختار المعرّف الذي يعرفه — مع تحذير صريح.
    //
    // فيبقى البناء أخضر اليوم، ويصير الفصل نافذاً من تلقاء نفسه لحظة نزول
    // google-services.json جديد يحوي الحزم الثلاث. لا تعديل شيفرة بعدها.
    def registeredPackages = []
    def googleServices = file('google-services.json')
    if (googleServices.exists()) {
        registeredPackages = new groovy.json.JsonSlurper()
            .parse(googleServices)
            .client
            .collect { it.client_info.android_client_info.package_name }
    }

    def resolvedApplicationId = wantedApplicationId
    if (!registeredPackages.contains(wantedApplicationId)) {
        resolvedApplicationId = baseApplicationId
        if (wantedApplicationId != baseApplicationId) {
            logger.warn(
                "\n[flavour] '${wantedApplicationId}' is not registered in " +
                "google-services.json — falling back to '${baseApplicationId}'.\n" +
                "[flavour] This build CANNOT be installed alongside the other " +
                "flavours until that package is added in the Firebase console " +
                "and google-services.json is replaced.\n"
            )
        }
    }

    defaultConfig {
        applicationId resolvedApplicationId
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        // رقم البناء لا رقمٌ ثابت.
        //
        // كان `1` في كلّ بناء، وأندرويد يقرأ هذا الرقم وحده ليعرف أيّ النسختين
        // أحدث. فنسخةٌ بُنيت اليوم ونسخةٌ بُنيت قبل أسبوع متساويتان عنده، ولا
        // سبيل لمعرفة أيّ بناءٍ على الجهاز حين يُبلَّغ عن عطل.
        //
        // يأتي من CI — `-PbuildNumber=${{ github.run_number }}` — فيزيد وحده
        // ولا يُنسى. والافتراضي `1` للبناء المحلّي حيث لا رقم تشغيل.
        versionCode (project.findProperty('buildNumber') ?: '1').toString().toInteger()
        versionName '1.0.0+' + (project.findProperty('buildNumber') ?: '1').toString()

        // مفتاح الخرائط يُحقن عند البناء ولا يُخزَّن في المستودع:
        //   flutter build apk --release -Pmaps.api.key=AIza...
        // والافتراضي فارغ كي يبني المستودع بلا مفتاح — عندها تظهر الخريطة
        // فارغة، وهو فشل مرئي أهون من فشل البناء كلّه.
        // يُولَّد كمورد بدل ملفّ في res/: ثلاثة مجلّدات مصادر لأجل لون واحد
        // هي ثلاثة أماكن تُنسى.
        resValue "color", "ic_launcher_background",
                 (flavorIconColor[flavorName] ?: '#0D1B4C')

        manifestPlaceholders += [
            MAPS_API_KEY: (project.findProperty('maps.api.key') ?: ''),
            // ثلاثة تطبيقات باسم واحد على شاشة واحدة لا يُعرف أيّها أيّ.
            APP_LABEL: (flavorLabel[flavorName] ?: 'Taibah')
        ]
    }

    // التوقيع من متغيّرات البيئة لا من ملف في المستودع: مفتاح التوقيع أخطر ما
    // في التطبيق — من يملكه ينشر تحديثاً باسمك. فالملف يصل عبر سرّ CI ويُكتب
    // في مسار مؤقّت، ولا يدخل git أبداً.
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // بلا مفتاح يعود إلى توقيع التصحيح، فيبقى البناء المحلي عاملاً
            // للتجربة. والفرق مرئي: نسخة موقّعة بمفتاح التصحيح لا تُقبل في
            // المتجر ولا تُحدّث نسخةً موقّعة بغيره.
            signingConfig System.getenv("KEYSTORE_PATH")
                ? signingConfigs.release
                : signingConfigs.debug
            // minifyEnabled false // (اختياري)
        }
    }
}

flutter {
    source '../..'
}
