plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'    // الأفضل من kotlin-android
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.oago.com.ng.flutter_projects'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.rididago.com'
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'

        // مفتاح الخرائط يُحقن عند البناء ولا يُخزَّن في المستودع:
        //   flutter build apk --release -Pmaps.api.key=AIza...
        // والافتراضي فارغ كي يبني المستودع بلا مفتاح — عندها تظهر الخريطة
        // فارغة، وهو فشل مرئي أهون من فشل البناء كلّه.
        manifestPlaceholders += [
            MAPS_API_KEY: (project.findProperty('maps.api.key') ?: '')
        ]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // minifyEnabled false // (اختياري)
        }
    }
}

flutter {
    source '../..'
}
