name: Build APK

# The APK is built here rather than on a machine, because that is the only
# place this repository is guaranteed to build the same way twice: the SDK
# version, the JDK and the Android toolchain are all pinned below instead of
# being whatever the person pressing the button happens to have installed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "انشر النتيجة كإصدار — روابط تنزيل مباشرة للجوّال"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # نكهة لكل تطبيق، ومصفوفة تبنيهما معاً.
    #
    # وهذا هو موضع الحجّة الأمنية عملياً: نقطة الدخول تحدّد ما يدخل الحزمة، لأن
    # مترجم Dart يُبقي كل ما يمكن بلوغه من `main()`. فلوحة الإدارة لا تصل إلى
    # هاتف راكب لأنها ليست في شجرة استيراده — لا لأن شرطاً يخفيها. راجع
    # lib/app_flavor.dart.
    #
    # `fail-fast: false` كي لا يُلغي فشلُ نكهة بناءَ الأخرى: نكهتان تفشلان
    # لسببين مختلفين، ورؤيتهما معاً أسرع من جولتين.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: passenger
            target: lib/main.dart
            artifact: taibah-passenger-release
          - flavor: driver
            target: lib/main_driver.dart
            artifact: taibah-driver-release
          - flavor: admin
            target: lib/main_admin.dart
            artifact: taibah-admin-release

    # `secrets` is not available inside an `if:` expression — only `env` is. So
    # the secret is lifted to the job environment here and the steps below test
    # `env.KEYSTORE_BASE64` instead. Without this the whole file fails to parse,
    # which takes every build down, not just the signing step.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      # Gradle 8.7 (see android/gradle/wrapper/gradle-wrapper.properties) and
      # the Android Gradle Plugin both require 17. On 21 the build fails late,
      # inside Gradle, with an error that does not name the JDK.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Latest stable rather than a pin, and that is the fix for a real failure
      # rather than a preference.
      #
      # There is no pubspec.lock in this repository, so pub resolves the newest
      # packages the constraints allow — geolocator 14, permission_handler 12.
      # Those need compileSdk 35, and `compileSdk flutter.compileSdkVersion` is
      # whatever the installed SDK says: 34 on Flutter 3.24. Gradle then failed
      # configuring :geolocator_android with "compileSdkVersion is not
      # specified", which names neither the plugin version nor the SDK that
      # actually disagree.
      #
      # Pinning the SDK without a lockfile pins only half the pair and leaves
      # the other half free to drift past it. Pin both or neither; until there
      # is a lockfile, tracking stable keeps the two in step.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # كان يُختم بـ`|| true`، فلا يُفشل شيئاً — ولا حتى الأخطاء. كان ذلك
      # صحيحاً يوم لم يكن في المستودع بناءٌ أخضر واحد: إخفاء الـAPK خلف تحذيرات
      # سبقت هذا الملف لا يفيد أحداً.
      #
      # ذلك اليوم مضى. `|| true` يسقط الآن، وتبقى `--no-fatal-*`: التحذيرات
      # والملاحظات تُعرَض ولا تُفشِل، والأخطاء تُفشِل — وهو ما يجب أن تفعله.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # يُنفَّذ ولا يُتسامح معه، بخلاف المحلّل أعلاه — وحساب نطاقات الجيوهاش هو
      # السبب. خطأٌ فيه لا يُسقط التطبيق بل يُخفي السائقين، فتقول الشاشة «لا
      # يوجد سائقون» وهي صادقة في ما ترى. عطلٌ صامت كهذا لا تمسكه تجربة يدوية
      # إلا بالمصادفة، فيُمسك هنا.
      - name: Test
        run: flutter test

      # android/gradlew and gradle-wrapper.jar are not in the repository — they
      # are covered by .gitignore. The Flutter tool injects its own wrapper when
      # it finds none, and keeps the existing gradle-wrapper.properties, so the
      # pinned Gradle 8.7 is still what runs. If this step ever fails on a
      # missing wrapper, commit the wrapper rather than changing the pin.
      # يُكتب من السرّ إلى مسار مؤقّت خارج مساحة العمل، فلا يمكن أن يُلتقط في
      # أثر أو يُدفع سهواً. غيابه ليس فشلاً: البناء يعود إلى توقيع التصحيح،
      # وهو ما نريده لطلبات السحب.
      - name: Restore the upload keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # ملفٌّ واحد يفتح في أي هاتف، لا ثلاثة يختار المستخدم بينها.
      #
      # كان `--split-per-abi` يقسم المخرَج بحسب معمارية المعالج، فتخرج ثلاث
      # حزم لكل نكهة. وهو الصواب في متجر Play — يرسل المتجر إلى كل جهاز حصّته
      # وحدها — لكنه خطأ حين تُسلَّم الحزمة يداً بيد: من ينزّلها لا يعرف معالج
      # هاتفه، ولا يجب أن يُسأل. وتثبيت الخاطئة يفشل برسالة لا تدلّ على السبب.
      #
      # فالحزمة الآن جامعة: مكتبةٌ أصلية لكل معمارية داخل ملفّ واحد، ويختار
      # النظام عند التثبيت. الثمن ميغابايتات، والمقابل أن السؤال يختفي.
      #
      # وx86_64 مستثناة افتراضاً: لا يستعملها هاتف بيع في السنوات الأخيرة —
      # المحاكيات وبعض أجهزة Chromebook وحدها. إدراجها يضخّم الملفّ لأجل من
      # لا يحمله. أضفها عند الحاجة:
      #   Settings ← Variables ← ANDROID_ABIS = android-arm,android-arm64,android-x64
      #
      # والسوق متغيّر واحد يحمل البلد والعملة ومركز الخريطة معاً — راجع
      # lib/market.dart. السودان معرَّفٌ هناك وجاهز، ويُفعَّل بـ MARKET=SD
      # بلا تعديل شيفرة.
      #
      # ولمتجر Play لاحقاً: `flutter build appbundle` — يتولّى المتجر التقسيم
      # عندها، فيصل كل جهاز أصغر مما يصله من هذه الحزمة.
      - name: Build ${{ matrix.flavor }} APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # بناءٌ بلا مفتاح خرائط ينجح ويُنشر، وخريطته رماديّة فارغة. صمتَ
          # أربعين بناءً على هذا. التحذير هنا كي يُرى في السجلّ لا في الجوّال.
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::No MAPS_API_KEY secret — maps will be blank in this build. Set it in Settings → Secrets → Actions."
          fi

          flutter build apk --release \
            --target-platform "${{ vars.ANDROID_ABIS || 'android-arm,android-arm64' }}" \
            -t "${{ matrix.target }}" \
            -Pflavor="${{ matrix.flavor }}" \
            -PbuildNumber="${{ github.run_number }}" \
            --dart-define=MAPS_API_KEY="$MAPS_API_KEY" \
            --dart-define=MARKET="${{ vars.MARKET || 'SA' }}" \
            -Pmaps.api.key="$MAPS_API_KEY"

      # الاسم يقول أيّ تطبيق هذا. `app-release.apk` ثلاث مرّات في مجلّد
      # التنزيلات هو ثلاثة ملفّات لا يُعرف أيّها أيّ.
      - name: Name it after its flavour
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${{ matrix.artifact }}.apk"

      - name: Report how it was signed
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            echo "signed with the upload key"
          else
            echo "::warning::No KEYSTORE_BASE64 secret — signed with the debug key, not publishable."
          fi

      - name: List what was produced
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/${{ matrix.artifact }}.apk
          if-no-files-found: error
          retention-days: 30

  # لوحة الإدارة على المتصفّح — من نفس الملفّ الذي تُبنى منه حزمة الأندرويد.
  #
  # لا هجرة ولا إعادة كتابة: `-t lib/main_admin.dart` هو ذاته في الحالتين،
  # وFlutter يبني الهدفين من شجرة الاستيراد نفسها. وهذا يعمل لأن نكهة الإدارة
  # لا تستورد geolocator ولا google_maps_flutter ولا permission_handler —
  # تحقّقتُ بالبحث. لو استوردت واحدةً منها لانكسر بناء الويب وحده، وهو أوضح
  # دليل على أن الفصل بين النكهات حقيقي لا اسمي.
  #
  # ولا تُبنى نكهتا الراكب والسائق للويب: كلتاهما تقوم على الخرائط والموقع،
  # وتطبيق رحلات في متصفّح ليس منتجاً.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # المعرّف علني بحكم التصميم — يظهر في كل حزمة تُبنى — فهو متغيّر لا سرّ.
      #
      # وكان هذا الفحص يسأل «هل هو فارغ؟» وحدها، فمرّ معرّفُ **أندرويد** ونجح
      # البناء. وهو أسوأ أنواع النجاح: `String.fromEnvironment` تقبل أي نصّ،
      # فيُبنى الموقع كاملاً ثم يفشل `Firebase.initializeApp` في المتصفّح
      # وتبقى صفحة بيضاء بلا رسالة تدلّ على السبب.
      #
      # نفس شكل العطل الذي أوقعنا فيه `country:NG`: لا البناء يفشل ولا الطلب،
      # ويظهر عند الاستعمال وحده. فالفحص الآن على **الشكل** لا على الوجود:
      #
      #   1:19401527632:web:0a1b2c3d…      ✅
      #   1:19401527632:android:da0113…    ❌ بطاقة أندرويد لا ويب
      # المعرّف علني بحكم التصميم — يظهر في كل حزمة تُبنى — فهو متغيّر لا سرّ.
      #
      # وحالتان مختلفتان تُعامَلان مختلفتين:
      #
      #   غير مضبوط  → تخطٍّ. «الويب لم يُهيَّأ بعد» حالةٌ مشروعة، ولا يصحّ أن
      #                توقف عملَ الأندرويد الذي لا يقرأ هذا المتغيّر أصلاً.
      #   مضبوط وخطأ → فشل صريح. قيمةٌ خاطئة تُبنى بنجاح وتُنتج صفحة بيضاء في
      #                المتصفّح، فالفشل هنا أرخص من اكتشافه بعد أسبوع.
      - name: Validate the web app id
        id: webid
        env:
          RAW_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
        run: |
          # تُنزع المسافات وفواصل الأسطر أولاً: لصقُ القيمة في حقل المتصفّح
          # يحملها سطراً زائداً في الغالب، وهو ما وقع فعلاً — فخرجت رسالة الخطأ
          # مقطوعة وأشارت إلى «مشروع مختلف» بدل السبب الحقيقي.
          WEB_APP_ID=$(printf '%s' "$RAW_WEB_APP_ID" | tr -d '[:space:]')

          if [ -z "$WEB_APP_ID" ]; then
            echo "::notice::FIREBASE_WEB_APP_ID is not set — skipping the web build."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # الشكل: <version>:<project number>:web:<hash>
          if ! printf '%s' "$WEB_APP_ID" | grep -Eq '^[0-9]+:[0-9]+:web:[0-9a-zA-Z]+$'; then
            platform=$(printf '%s' "$WEB_APP_ID" | cut -d: -f3)
            echo "::error::FIREBASE_WEB_APP_ID is not a web app id (platform segment: '${platform:-none}')."
            echo "A web app id looks like 1:19401527632:web:0a1b2c3d4e5f6a7b8c9d0e"
            echo "Firebase console > Project settings > General > Your apps"
            echo "  > the </> web card (not the Android one) > Config > appId"
            exit 1
          fi

          # رقم المشروع جزءٌ من المعرّف، فمعرّفٌ من مشروع آخر سليمُ الشكل
          # ويفشل عند الإقلاع بالقدر نفسه. يُقارن بما في google-services.json —
          # المصدر الوحيد للحقيقة في المستودع.
          expected=$(python3 -c "import json;print(json.load(open('android/app/google-services.json'))['project_info']['project_number'])")
          actual=$(printf '%s' "$WEB_APP_ID" | cut -d: -f2)

          if [ "$expected" != "$actual" ]; then
            echo "::error::Project number mismatch — the id belongs to project $actual, this repository targets $expected."
            exit 1
          fi

          echo "web app id: $WEB_APP_ID (project $actual)"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "id=$WEB_APP_ID" >> "$GITHUB_OUTPUT"

      # القيمة المنظَّفة من الخطوة أعلاه، لا الخام: سطرٌ زائد يدخل الحزمة
      # ويُفسد المعرّف بصمت.
      - name: Build the admin panel for the web
        if: steps.webid.outputs.configured == 'true'
        run: |
          flutter build web --release \
            -t lib/main_admin.dart \
            --dart-define=FIREBASE_WEB_APP_ID="${{ steps.webid.outputs.id }}" \
            --dart-define=MARKET="${{ vars.MARKET || 'SA' }}"

      - name: List what was produced
        if: steps.webid.outputs.configured == 'true'
        run: ls -lh build/web/

      # الملفّ الذي يجعل البناء قابلاً لإعادة الإنتاج — يُلتقط من هنا لأنه
      # يُولَّد بنسخة Flutter المثبَّتة في CI، وهي المرجع لا جهاز أحد.
      - name: Upload the resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Upload the web build
        if: steps.webid.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taibah-admin-web
          path: build/web/
          if-no-files-found: error
          retention-days: 30

  # إصدارٌ فيه روابط تنزيل مباشرة — لأن أثر البناء لا يُنزَّل على جوّال.
  #
  # أثر Actions يشترط ثلاثة أشياء يعجز عنها متصفّح الجوّال عادةً: تسجيل دخول
  # إلى GitHub، وتنزيل ملفّ `.zip`، وفكّ ضغطه ثم فتح ما بداخله. وهذا هو سبب
  # تعطّل التجربة كلّها — لا التثبيت ولا التوقيع ولا هوية الحزمة.
  #
  # أمّا أصل الإصدار فرابطٌ مباشر إلى ملفّ `.apk` واحد: يُفتح بضغطة، بلا تسجيل
  # دخول في مستودع عام، وبلا فكّ ضغط.
  #
  # ولا يُنشر مع كل بناء: يُطلب صراحةً بعلامة `publish` عند التشغيل اليدوي،
  # كي لا يمتلئ سجلّ الإصدارات بكل دفعة.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # الحدّ الأدنى: كتابة المحتوى وحدها، ولا شيء غيرها.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect the three APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: What was collected
        run: ls -lh apks/

      # `gh` مثبَّت على المشغِّل أصلاً، فلا حاجة إلى إجراء من طرف ثالث لعمل
      # يقع كلّه داخل هذا المستودع.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"

          gh release create "$TAG" \
            --title "Taibah — بناء ${{ github.run_number }}" \
            --notes "$(cat <<'NOTES'
          ثلاث حزم، واحدة لكل تطبيق. اضغط على الملفّ لتنزيله وتثبيته مباشرةً.

          | الملفّ | التطبيق | الاسم على الشاشة |
          |---|---|---|
          | `taibah-passenger-release.apk` | الراكب | Taibah |
          | `taibah-driver-release.apk` | السائق | Taibah سائق |
          | `taibah-admin-release.apk` | الإدارة | Taibah إدارة |

          كلّها جامعة — تعمل على أي هاتف — ولكلٍّ هويّة حزمة مستقلّة، فتجتمع
          الثلاثة على جهاز واحد.

          أوّل تثبيت من خارج المتجر يطلب إذن «تثبيت تطبيقات غير معروفة» للمتصفّح
          أو لمدير الملفّات. اسمح به مرّة، ولن يُسأل ثانيةً.
          NOTES
          )" \
            apks/*.apk

          echo "### الإصدار" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
