name: Deploy database rules

# القواعد تُنشر من هنا لا من الكونسول، لسبب واحد: قاعدة تُحرَّر بالنقر لا تاريخ
# لها ولا مراجعة ولا رجعة. أمّا هنا فكل تغيير التزامٌ يُقرأ ويُراجَع ويُستعاد.
#
# ولا يمسّ هذا السرَّ أحد: `FIREBASE_SERVICE_ACCOUNT` يُكتب مرة في إعدادات
# المستودع، ولا يظهر في سجلّ ولا في شيفرة — يقرأه المشغِّل وحده لحظة النشر.

on:
  push:
    branches: [main]
    paths:
      - "database.rules.json"
      - "firebase.json"
      - ".github/workflows/deploy-rules.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # يفشل مبكراً وبرسالة مفهومة، بدل أن يسقط داخل firebase-tools برسالة
      # مصادقة لا تدلّ على السبب.
      - name: Check the secret is set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Validate the rules parse as JSON
        run: |
          python3 -c "import json; json.load(open('database.rules.json'))"
          echo "rules parse cleanly"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # المفتاح يُكتب في ملف مؤقّت داخل مساحة العمل ثم يُحذف. تمريره عبر
      # GOOGLE_APPLICATION_CREDENTIALS هو ما تتوقّعه أداة Firebase.
      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT || 'taxi-taiba' }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          firebase deploy \
            --only database \
            --project "$FIREBASE_PROJECT" \
            --non-interactive

          rm -f "$RUNNER_TEMP/sa.json"
