name: Lockfile

# يحلّ التبعيّات ويلتزم `pubspec.lock` في الفرع.
#
# لماذا مهمّة مستقلّة بدل أن يُولَّد الملفّ على جهاز أحد؟ لأنّ الملفّ يجب أن
# يُولَّد بنسخة Flutter التي تبني فعلاً — وهي التي في CI لا التي على جهاز. ملفّ
# قفلٍ من بيئة أخرى يثبّت إصدارات لا تُبنى هنا، وهو أسوأ من غيابه.
#
# ولا يُشغَّل تلقائياً: قفلُ التبعيّات قرار، ويُراجَع فرقه قبل الدمج كأيّ تغيير.

on:
  workflow_dispatch:
    inputs:
      upgrade:
        description: "true = رقّ التبعيّات إلى أحدث ما تسمح به القيود قبل القفل"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve
        run: |
          if [ "${{ inputs.upgrade }}" = "true" ]; then
            flutter pub upgrade
          else
            flutter pub get
          fi

      - name: Report
        run: |
          {
            echo '### التبعيّات المقفولة'
            echo
            echo "Flutter: $(flutter --version | head -1)"
            echo
            echo "حزمة مباشرة ومنقولة: $(grep -c '^  [a-z_]*:' pubspec.lock || echo '?')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the lock
        run: |
          if git diff --quiet -- pubspec.lock && git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo "::notice::pubspec.lock unchanged."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f pubspec.lock
          git commit -m "Pin the dependency tree resolved by CI

يُولَّد بنسخة Flutter التي تبني فعلاً، لا بنسخة جهاز. وبلا هذا الملفّ يقفز
\`flutter pub get\` إلى أحدث ما تسمح به القيود في كلّ تشغيل، فتُسقط حزمةٌ
أصدرت إصداراً جديداً بناءً لم تُمسّ شيفرته."

          git push origin HEAD:"${{ github.ref_name }}"
