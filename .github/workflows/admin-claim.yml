name: Admin claim

# صفة المدير تُمنح من هنا لا من الشيفرة، ولا تمرّ كلمة مرور في هذا المسار:
# الأداة تعمل على حساب قائم ينشئه صاحبه بنفسه.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "grant = منح · revoke = سحب · list = عرض"
        type: choice
        required: true
        default: list
        options: [list, grant, revoke]
      email:
        description: "بريد الحساب (مطلوب لـ grant و revoke)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Admin SDK
        run: npm install firebase-admin@12 --no-save

      - name: Check the secret is set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set."
            exit 1
          fi

      - name: ${{ inputs.action }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RTDB_URL: ${{ vars.RTDB_URL || 'https://taxi-taiba-default-rtdb.europe-west1.firebasedatabase.app' }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          node tools/set-admin-claim.js \
            "${{ inputs.action }}" "${{ inputs.email }}" | tee "$RUNNER_TEMP/out.txt"

          rm -f "$RUNNER_TEMP/sa.json"

          {
            echo '### صفة المدير'
            echo
            echo '```'
            cat "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
